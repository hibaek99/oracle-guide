<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <div class="header">
    <div class="badge"><span class="badge-dot"></span>Oracle AI Campus · #Data Track</div>

  <div class="progress-wrap">
    <span class="progress-text">진행률</span>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <span class="progress-label" id="progressLabel">0 / 6</span>
  </div>

  <div class="steps" id="stepsContainer"></div>

  <div class="footer">
    ※ 일정은 내부 운영 사정에 따라 변동될 수 있습니다.
  </div>

<script src="script.js"></script>

</html>
