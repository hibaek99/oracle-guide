<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle AI Campus · Data Track 합류 절차</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple-50: #EEEDFE;
    --purple-200: #AFA9EC;
    --purple-600: #534AB7;
    --purple-800: #3C3489;
    --gray-50: #F7F7F5;
    --gray-100: #EFEFED;
    --gray-300: #D3D1C7;
    --gray-500: #888780;
    --gray-700: #5F5E5A;
    --gray-900: #2C2C2A;
    --green-50: #EAF3DE;
    --green-700: #27500A;
    --amber-50: #FAEEDA;
    --amber-700: #633806;
    --text-primary: #1A1A18;
    --text-secondary: #5F5E5A;
    --text-hint: #888780;
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.15);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F5F4F0;
    color: var(--text-primary);
    min-height: 100vh;
    padding: 40px 20px 60px;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--purple-50);
    color: var(--purple-800);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 14px;
    border: 1px solid var(--purple-200);
  }
  .badge-dot {
    width: 6px; height: 6px;
    background: var(--purple-600);
    border-radius: 50%;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }
  .header p {
    font-size: 13.5px;
    color: var(--text-secondary);
  }

  /* Progress bar */
  .progress-wrap {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .progress-bar-track {
    flex: 1;
    height: 4px;
    background: var(--gray-100);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--purple-600), var(--purple-200));
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .progress-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--purple-600);
    white-space: nowrap;
  }
  .progress-text {
    font-size: 12px;
    color: var(--text-hint);
    white-space: nowrap;
  }

  /* Steps */
  .steps { display: flex; flex-direction: column; gap: 8px; }

  .step {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .step:hover { border-color: var(--border-hover); }
  .step.active {
    border-color: var(--purple-200);
    box-shadow: 0 0 0 3px rgba(83,74,183,0.06);
  }

  .step-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }

  .step-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    flex-shrink: 0;
    background: var(--gray-100);
    color: var(--gray-700);
    transition: background 0.2s, color 0.2s;
  }
  .step.active .step-num {
    background: var(--purple-600);
    color: white;
  }

  .step-info { flex: 1; min-width: 0; }
  .step-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--purple-600);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .step.active .step-label { color: var(--purple-600); }
  .step-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.2px;
  }
  .step-meta {
    font-size: 12px;
    color: var(--text-hint);
    margin-top: 2px;
  }

  .step-chevron {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--gray-50);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    color: var(--text-hint);
    transition: transform 0.25s, background 0.2s;
    flex-shrink: 0;
  }
  .step.active .step-chevron {
    transform: rotate(180deg);
    background: var(--purple-50);
    color: var(--purple-600);
    border-color: var(--purple-200);
  }

  /* Body */
  .step-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .step.active .step-body { max-height: 800px; }

  .step-content {
    padding: 0 18px 18px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .desc {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text-secondary);
    margin-bottom: 12px;
    white-space: pre-line;
  }

  /* Tags */
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 6px;
    margin: 2px 3px 2px 0;
  }
  .tag-warn { background: var(--amber-50); color: var(--amber-700); }
  .tag-purple { background: var(--purple-50); color: var(--purple-800); }
  .tag-green { background: var(--green-50); color: var(--green-700); }

  /* Notice box */
  .notice {
    background: var(--gray-50);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.7;
    margin: 10px 0;
  }
  .notice strong { color: var(--text-primary); font-weight: 600; }

  /* Check rows */
  .check-section {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    margin-top: 10px;
  }
  .check-item {
    display: flex;
    gap: 10px;
    padding: 11px 14px;
    font-size: 13px;
    line-height: 1.5;
    align-items: flex-start;
  }
  .check-item + .check-item {
    border-top: 1px solid var(--border);
  }
  .check-item.yes { background: rgba(234,243,222,0.4); }
  .check-item.no { background: white; }
  .check-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
  .check-main { font-weight: 600; color: var(--text-primary); }
  .check-sub { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }

  /* Date rows */
  .date-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin: 10px 0;
  }
  .date-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Link */
  .cta-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--purple-600);
    color: white;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    text-decoration: none;
    margin: 10px 0;
    transition: background 0.15s;
  }
  .cta-link:hover { background: var(--purple-800); }

  /* How-to path */
  .how-path {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    color: var(--text-secondary);
    background: var(--gray-50);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin: 10px 0;
  }
  .how-path .arrow { color: var(--gray-300); }
  .how-path .kw {
    background: var(--purple-50);
    color: var(--purple-800);
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 12px;
  }

  /* Result banner */
  .result-banner {
    background: linear-gradient(135deg, var(--purple-50) 0%, white 100%);
    border: 1.5px solid var(--purple-200);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-top: 4px;
    text-align: center;
  }
  .result-banner .emoji { font-size: 24px; margin-bottom: 6px; }
  .result-banner .title { font-size: 14px; font-weight: 600; color: var(--purple-800); }
  .result-banner .sub { font-size: 12px; color: var(--text-hint); margin-top: 3px; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--text-hint);
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="badge"><span class="badge-dot"></span>Oracle AI Campus · #Data Track</div>
    <h1>합류 절차 안내</h1>
    <p>페이스러너 HI-D와 함께 단계별로 진행해요</p>
  </div>

  <div class="progress-wrap">
    <span class="progress-text">진행률</span>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <span class="progress-label" id="progressLabel">0 / 6</span>
  </div>

  <div class="steps" id="stepsContainer"></div>

  <div class="footer">
    ※ 일정은 내부 운영 사정에 따라 변동될 수 있습니다.
  </div>
</div>

<script>
const steps = [
  {
    label: "STEP 1",
    title: "간편 신청",
    meta: "홈페이지를 통해 신청",
    desc: "홈페이지를 통해 Oracle AI Campus에 신청한 단계입니다.",
    checks: [
      { yes: true, main: "내일배움카드 소지 중", sub: "→ 서류 전형으로 이동하세요" },
      { yes: false, main: "아직 내일배움카드가 없어요", sub: "→ 내일배움카드 발급 방법을 먼저 확인하세요" }
    ]
  },
  {
    label: "STEP 2",
    title: "서류 전형",
    meta: "마감 3/18(수)",
    desc: "내일배움카드 소지 후, 입과 담당자와 유선 통화로 수강 가능 여부를 확인하셨다면 서류를 제출해 주세요.\n⚠️ 서류는 한 번만 제출해 주세요. 신중하게 작성 부탁드립니다.",
    link: { label: "서류 작성하러 가기", url: "https://forms.gle/g9go8SzFFu4M5k9U8" },
    checks: [
      { yes: true, main: "서류 제출 완료", sub: "→ 합격 시 사전 테스트 일정을 개별 안내드립니다" },
      { yes: false, main: "아직 제출 전", sub: "→ 3/18(수)까지 제출 필수. 간편 신청 + 서류 제출 모두 완료해야 신청이 완료됩니다" }
    ]
  },
  {
    label: "STEP 3",
    title: "사전 역량 테스트",
    meta: "서류 합격자 대상 · 개별 안내",
    desc: "서류 신청 완료자 대상으로 사전 역량 테스트가 진행됩니다. 일정은 개별 안내 예정입니다.",
    notice: "테스트는 전반적인 교과 이해도 파악 목적입니다. 생성형 AI 없이 본인 지식 수준으로 응시해 주세요. 응시자 평균을 참고해 6개월 학습이 설계되므로, 실력 그대로 응시하셔야 학습을 원활하게 따라오실 수 있습니다.",
    extra: "💡 온라인 입학 설명회도 해당 기간 중 화상으로 진행됩니다. 신청 링크는 순차 발송 예정입니다."
  },
  {
    label: "STEP 4",
    title: "고용24 수강신청",
    meta: "내일배움카드 필수",
    desc: "사전 역량 테스트 응시 완료자는 고용24 홈페이지에서 수강신청을 진행해 주세요. 💳 내일배움카드를 반드시 소지하셔야 합니다.",
    howPath: ["고용24", "취업지원", "훈련 찾기·신청", "오라클 아카데미 검색"],
    checks: [
      { yes: true, main: "수강신청 완료", sub: "→ 면접 대상 안내 전화를 기다려 주세요" },
      { yes: false, main: "수강신청 미완료", sub: "→ 내일배움카드 발급·수강신청에 어려움이 있으면 언제든 문의하세요" }
    ]
  },
  {
    label: "STEP 5",
    title: "면접 전형 (대면)",
    meta: "3/24(화) · 3/25(수) · 서울 성동구",
    desc: "고용24 수강신청 완료 후 면접 대상자에게 개별 문자·전화로 안내합니다. 📞 문자에 답장이 없을 경우 유선 연락드리니 전화를 꼭 받아주세요.",
    dates: [
      "📅 2026년 3월 24일(화), 25일(수)",
      "⏰ 면접 시간은 개별 안내",
      "🙋 그룹 면접으로 진행",
      "🏢 서울시 성동구 (자세한 장소 추후 안내)"
    ],
    checks: [
      { yes: true, main: "참석 문자 회신 완료", sub: "→ 면접장에서 만나요!" },
      { yes: false, main: "아직 회신 전", sub: "→ 참석 의사를 알려주셔야 면접이 확정됩니다. 지금 바로 회신해 주세요!" }
    ]
  },
  {
    label: "STEP 6",
    title: "최종 결과 발표",
    meta: "2026년 3월 4주차 예정",
    isResult: true
  }
];

let openIndex = 0;

function render() {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = steps.map((s, i) => {
    const isOpen = i === openIndex;
    return `
    <div class="step${isOpen ? ' active' : ''}" id="step-${i}">
      <div class="step-header" onclick="toggle(${i})">
        <div class="step-num">${i + 1}</div>
        <div class="step-info">
          <div class="step-label">${s.label}</div>
          <div class="step-title">${s.title}</div>
          ${s.meta ? `<div class="step-meta">${s.meta}</div>` : ''}
        </div>
        <div class="step-chevron">▼</div>
      </div>
      <div class="step-body">
        <div class="step-content">
          ${s.isResult ? `
            <div class="result-banner">
              <div class="emoji">🎓</div>
              <div class="title">합격자 대상 개별 안내 예정</div>
              <div class="sub">2026년 3월 4주차 예정 · 일정은 변동될 수 있습니다</div>
            </div>
          ` : `
            ${s.desc ? `<p class="desc">${s.desc}</p>` : ''}
            ${s.link ? `<a class="cta-link" href="${s.link.url}" target="_blank">${s.link.label} →</a>` : ''}
            ${s.howPath ? `
              <div class="how-path">
                ${s.howPath.map((p, pi) => `${pi > 0 ? '<span class="arrow">›</span>' : ''}<span${pi === s.howPath.length - 1 ? ' class="kw"' : ''}>${p}</span>`).join('')}
              </div>
            ` : ''}
            ${s.dates ? `<div class="date-list">${s.dates.map(d => `<div class="date-row">${d}</div>`).join('')}</div>` : ''}
            ${s.notice ? `<div class="notice"><strong>유의사항</strong><br>${s.notice}</div>` : ''}
            ${s.extra ? `<div class="notice">${s.extra}</div>` : ''}
            ${s.checks ? `
              <div class="check-section">
                ${s.checks.map(c => `
                  <div class="check-item ${c.yes ? 'yes' : 'no'}">
                    <span class="check-icon">${c.yes ? '✅' : '❎'}</span>
                    <div>
                      <div class="check-main">${c.main}</div>
                      <div class="check-sub">${c.sub}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          `}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggle(i) {
  openIndex = openIndex === i ? -1 : i;
  render();
  updateProgress();
}

function updateProgress() {
  const pct = openIndex >= 0 ? Math.round(((openIndex + 1) / steps.length) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = (openIndex >= 0 ? openIndex + 1 : 0) + ' / ' + steps.length;
}

render();
updateProgress();
</script>
</body>
</html>
